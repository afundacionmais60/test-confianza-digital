<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evalúa tu confianza digital</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
.fade-in { animation: fadeIn .4s ease-in; }
@keyframes fadeIn { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }

.option-card { transition: all .25s ease; cursor:pointer; }
.option-card:hover { transform:translateY(-3px); box-shadow:0 8px 20px rgba(0,0,0,.08); }

.option-card.selected {
  border-color:#3b82f6;
  background:#eff6ff;
  box-shadow:0 0 0 3px rgba(59,130,246,.25);
}

.device-pop { animation: pop .25s ease; }
@keyframes pop { 0%{transform:scale(1);} 50%{transform:scale(1.03);} 100%{transform:scale(1);} }

.progress-bar { transition:width .3s ease; }
</style>
</head>

<body class="bg-gradient-to-br from-blue-50 to-blue-100 min-h-screen">

<div class="container mx-auto max-w-4xl px-4 py-10 fade-in">

<h1 class="text-4xl font-bold text-blue-900 text-center mb-6">
Evalúa tu confianza digital
</h1>

<p class="text-center text-gray-700 mb-8">
Este sencillo test del programa <strong>Igualdad Digital</strong> te permitirá evaluar tu nivel de confianza a la hora de usar la tecnología y te ofrecerá un plan personalizado para avanzar paso a paso.
</p>

<div class="bg-blue-50 rounded-2xl p-6 mb-6">
<h2 class="font-semibold text-blue-900 mb-3">📱 ¿Qué dispositivo utilizas?</h2>

<div class="grid grid-cols-1 md:grid-cols-2 gap-4">

<button id="device-android" class="option-card border-2 rounded-xl p-4 bg-white"
onclick="selectDevice('android')">
<div class="flex justify-between items-center">
<span>Android</span>
<svg viewBox="0 0 24 24" class="w-7 h-7">
<path fill="#3DDC84" d="M8.2 6.3 6.8 4.1c-.2-.3-.1-.7.2-.9.3-.2.7-.1.9.2l1.4 2.2c.8-.3 1.7-.5 2.7-.5s1.9.2 2.7.5l1.4-2.2c.2-.3.6-.4.9-.2.3.2.4.6.2.9l-1.4 2.2c1.6.9 2.7 2.5 2.9 4.4H5.3c.2-1.9 1.3-3.5 2.9-4.4z"/>
<path fill="#3DDC84" d="M6 11.5h12v6.2c0 1.2-1 2.3-2.3 2.3H8.3C7 20 6 18.9 6 17.7v-6.2z"/>
</svg>
</div>
</button>

<button id="device-ios" class="option-card border-2 rounded-xl p-4 bg-white"
onclick="selectDevice('ios')">
<div class="flex justify-between items-center">
<span>iPhone (iOS)</span>
<svg viewBox="0 0 24 24" class="w-7 h-7">
<path fill="#111827" d="M16.9 13.1c0 2.6 2.3 3.5 2.3 3.6-.0.1-.4 1.3-1.3 2.6-.8 1.1-1.7 2.2-3.1 2.2-1.3 0-1.7-.8-3.2-.8-1.4 0-2 .8-3.2.8-1.3 0-2.3-1.2-3.1-2.3-1.7-2.4-3-6.7-1.3-9.6.8-1.4 2.2-2.3 3.8-2.3 1.2 0 2.3.8 3.2.8.9 0 2.3-.9 3.9-.8.7 0 2.6.3 3.8 2-0.1.1-2.2 1.3-2.2 3.8z"/>
</svg>
</div>
</button>

</div>
</div>

<div class="text-center">
<button id="startBtn" disabled
class="bg-blue-600 disabled:bg-blue-300 text-white font-bold py-3 px-8 rounded-full">
Comenzar
</button>
</div>

</div>

<script>
let deviceType = null;

function selectDevice(type){
deviceType = type;

["android","ios"].forEach(t=>{
const el=document.getElementById("device-"+t);
if(el) el.classList.remove("selected","device-pop");
});

const selected=document.getElementById("device-"+type);
selected.classList.add("selected","device-pop");
setTimeout(()=>selected.classList.remove("device-pop"),300);

document.getElementById("startBtn").disabled=false;
}
</script>

</body>
</html>
